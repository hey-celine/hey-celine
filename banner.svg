 .dot{opacity:0;animation:show .4s 5s forwards}
 .cur{animation:blink 1s steps(1) infinite}
 .fade{opacity:0;animation:show 1.5s .3s forwards}
 .fade2{opacity:0;animation:show 1.5s 1.2s forwards}
 @keyframes draw{to{stroke-dashoffset:0}}
 @keyframes show{to{opacity:1}}
 @keyframes blink{50%{opacity:0}}
</style>
